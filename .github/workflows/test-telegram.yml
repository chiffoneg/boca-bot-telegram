name: Test Telegram message

# Solo se dispara a mano, desde la pestaña Actions. Manda un mensaje de
# prueba (con el formato real) para confirmar que TELEGRAM_BOT_TOKEN y
# TELEGRAM_CHAT_ID están bien cargados, sin tocar data/state.json.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mandar mensaje de prueba
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 send_test_message.py
