name: Watcher (mandar aviso de partido)

# Se dispara desde afuera (cron-job.org llama a la API de GitHub cada
# pocos minutos), porque el trigger "schedule" nativo de GitHub tiene
# prioridad baja y se atrasa horas en repos poco activos. El schedule
# de abajo queda igual, solo como backup redundante.
#
# Cada corrida hace dos cosas (ver scripts/watcher.py):
# 1. Si el último chequeo de partidos está viejo (más de 4hs), lo
#    refresca llamando a la API de fútbol — esto reemplaza al viejo
#    cron de "una vez a las 3am" con reintentos automáticos varias
#    veces al día.
# 2. Si ya es la hora de mandar el aviso (send_at_utc), lo manda. Para
#    esto NO llama a la API, solo lee el estado guardado.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Refrescar chequeo (si corresponde) y mandar aviso (si corresponde)
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          BOCA_TEAM_ID: ${{ vars.BOCA_TEAM_ID }}
        run: python watcher.py

      - name: Guardar data/next_match.json si cambió
        run: |
          git config user.name "boca-bot"
          git config user.email "boca-bot@users.noreply.github.com"
          git add data/next_match.json
          if git diff --cached --quiet; then
            echo "Sin cambios en data/next_match.json"
          else
            git commit -m "chore: actualizar estado de próximo partido"
            git pull --rebase
            git push
          fi
