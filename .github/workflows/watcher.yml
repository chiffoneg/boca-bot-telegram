name: Watcher (mandar aviso de partido)

# Se dispara desde afuera (cron-job.org llama a la API de GitHub cada
# pocos minutos), porque el trigger "schedule" nativo de GitHub tiene
# prioridad baja y se atrasa horas en repos poco activos. El schedule
# de abajo queda igual, solo como backup redundante.
#
# NO llama a ninguna API de fútbol: solo lee data/next_match.json
# (armado por daily-check.yml) y, si ya es la hora, manda el mensaje ya
# armado por Telegram.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Revisar si hay que mandar el aviso
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Guardar data/next_match.json si cambió
        run: |
          git config user.name "boca-bot"
          git config user.email "boca-bot@users.noreply.github.com"
          git add data/next_match.json
          if git diff --cached --quiet; then
            echo "Sin cambios en data/next_match.json"
          else
            git commit -m "chore: marcar aviso como enviado"
            git pull --rebase
            git push
          fi
